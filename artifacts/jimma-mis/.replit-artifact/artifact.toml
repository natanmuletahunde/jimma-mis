kind = "web"
previewPath = "/"
title = "Jimma City Address MIS"
version = "1.0.0"
id = "artifacts/jimma-mis"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18121

[services.development]
run = "pnpm --filter @workspace/jimma-mis run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jimma-mis", "run", "build" ]
publicDir = "artifacts/jimma-mis/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18121"
BASE_PATH = "/"
