openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Jimma City Digital Street Address MIS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: properties
  - name: approvals
  - name: dashboard
  - name: map
  - name: reports
  - name: kebeles
  - name: streets
  - name: blocks
  - name: audit-logs

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user from JWT token
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin and city_officer)
      parameters:
        - name: role
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /users/{id}/status:
    patch:
      operationId: updateUserStatus
      tags: [users]
      summary: Activate or deactivate a user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStatusUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /roles:
    get:
      operationId: getRoles
      tags: [users]
      summary: List available roles
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleItem"

  /properties:
    get:
      operationId: listProperties
      tags: [properties]
      summary: List properties with optional filters
      parameters:
        - name: kebele
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: property_type
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of properties
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyListResponse"
    post:
      operationId: createProperty
      tags: [properties]
      summary: Register a new property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"

  /properties/{id}:
    get:
      operationId: getProperty
      tags: [properties]
      summary: Get property details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
    patch:
      operationId: updateProperty
      tags: [properties]
      summary: Update property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyUpdate"
      responses:
        "200":
          description: Updated property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
    delete:
      operationId: deleteProperty
      tags: [properties]
      summary: Delete property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /properties/{id}/approve:
    post:
      operationId: approveProperty
      tags: [properties]
      summary: Approve a property and generate official address code
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalInput"
      responses:
        "200":
          description: Approved property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"

  /properties/{id}/reject:
    post:
      operationId: rejectProperty
      tags: [properties]
      summary: Reject a property with remarks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectionInput"
      responses:
        "200":
          description: Rejected property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"

  /properties/{id}/resubmit:
    post:
      operationId: resubmitProperty
      tags: [properties]
      summary: Resubmit a rejected property after edits
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resubmitted property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"

  /properties/{id}/submit:
    post:
      operationId: submitProperty
      tags: [properties]
      summary: Submit a draft property for kebele verification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Submitted property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "400":
          description: Validation error (missing GPS or photo)
        "403":
          description: Not allowed

  /properties/{id}/approvals:
    get:
      operationId: getPropertyApprovals
      tags: [approvals]
      summary: Get approval history for a property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approval history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApprovalRecord"

  /properties/check-duplicate:
    get:
      operationId: checkDuplicate
      tags: [properties]
      summary: Check for duplicate GPS or house number
      parameters:
        - name: latitude
          in: query
          schema:
            type: number
        - name: longitude
          in: query
          schema:
            type: number
        - name: house_number
          in: query
          schema:
            type: string
        - name: street_name
          in: query
          schema:
            type: string
        - name: block_code
          in: query
          schema:
            type: string
        - name: exclude_id
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Duplicate check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateCheckResult"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard summary statistics
      parameters:
        - name: from_date
          in: query
          schema:
            type: string
        - name: to_date
          in: query
          schema:
            type: string
        - name: kebele
          in: query
          schema:
            type: string
        - name: property_type
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/by-kebele:
    get:
      operationId: getByKebele
      tags: [dashboard]
      summary: Get property count grouped by kebele
      responses:
        "200":
          description: Properties by kebele
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KebeleCount"

  /dashboard/recent:
    get:
      operationId: getRecentProperties
      tags: [dashboard]
      summary: Get recently registered properties
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: kebele
          in: query
          schema:
            type: string
        - name: property_type
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: from_date
          in: query
          schema:
            type: string
        - name: to_date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Recent properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"

  /dashboard/trend:
    get:
      operationId: getDashboardTrend
      tags: [dashboard]
      summary: Get daily registration counts for the last 30 days
      responses:
        "200":
          description: Daily trend data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyTrend"

  /map/properties:
    get:
      operationId: getMapProperties
      tags: [map]
      summary: Get all properties with GPS for map display
      parameters:
        - name: kebele
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: property_type
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Map properties with GPS
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MapProperty"

  /map/summary:
    get:
      operationId: getMapSummary
      tags: [map]
      summary: Get summary statistics for the GIS map dashboard
      responses:
        "200":
          description: GIS map summary statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapSummary"

  /reports/properties:
    get:
      operationId: getPropertyReport
      tags: [reports]
      summary: Get property data for report/CSV export
      parameters:
        - name: kebele
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: property_type
          in: query
          schema:
            type: string
        - name: from_date
          in: query
          schema:
            type: string
        - name: to_date
          in: query
          schema:
            type: string
        - name: street_name
          in: query
          schema:
            type: string
        - name: enumerator_name
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Report data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"

  /reports/enumerator-performance:
    get:
      operationId: getEnumeratorPerformance
      tags: [reports]
      summary: Get per-enumerator registration statistics
      responses:
        "200":
          description: Enumerator performance data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnumeratorPerformance"

  /kebeles:
    get:
      operationId: listKebeles
      tags: [kebeles]
      summary: List all kebeles
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of kebeles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Kebele"
    post:
      operationId: createKebele
      tags: [kebeles]
      summary: Create a new kebele
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KebeleInput"
      responses:
        "201":
          description: Created kebele
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kebele"
        "409":
          description: Kebele code already exists

  /kebeles/{id}:
    put:
      operationId: updateKebele
      tags: [kebeles]
      summary: Update a kebele
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KebeleInput"
      responses:
        "200":
          description: Updated kebele
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kebele"
        "404":
          description: Kebele not found
        "409":
          description: Kebele code already exists
    delete:
      operationId: deleteKebele
      tags: [kebeles]
      summary: Delete a kebele
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: Cannot delete — in use by properties
        "404":
          description: Kebele not found

  /streets:
    get:
      operationId: listStreets
      tags: [streets]
      summary: List streets with optional filters
      parameters:
        - name: kebele_id
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of streets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Street"
    post:
      operationId: createStreet
      tags: [streets]
      summary: Create a new street
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreetInput"
      responses:
        "201":
          description: Created street
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Street"
        "409":
          description: Street code already exists within kebele

  /streets/{id}:
    put:
      operationId: updateStreet
      tags: [streets]
      summary: Update a street
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreetInput"
      responses:
        "200":
          description: Updated street
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Street"
        "404":
          description: Street not found
    delete:
      operationId: deleteStreet
      tags: [streets]
      summary: Delete a street
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: Cannot delete — in use by properties
        "404":
          description: Street not found

  /blocks:
    get:
      operationId: listBlocks
      tags: [blocks]
      summary: List blocks with optional filters
      parameters:
        - name: kebele_id
          in: query
          schema:
            type: integer
        - name: street_id
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of blocks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Block"
    post:
      operationId: createBlock
      tags: [blocks]
      summary: Create a new block
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockInput"
      responses:
        "201":
          description: Created block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Block"
        "409":
          description: Block code already exists within street

  /blocks/{id}:
    put:
      operationId: updateBlock
      tags: [blocks]
      summary: Update a block
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockInput"
      responses:
        "200":
          description: Updated block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Block"
        "404":
          description: Block not found
    delete:
      operationId: deleteBlock
      tags: [blocks]
      summary: Delete a block
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: Cannot delete — in use by properties
        "404":
          description: Block not found

  /audit-logs/summary:
    get:
      operationId: getAuditLogsSummary
      tags: [audit-logs]
      summary: Get audit log activity summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogSummary"

  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit-logs]
      summary: List audit logs with optional filters
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: entity_type
          in: query
          schema:
            type: string
        - name: from_date
          in: query
          schema:
            type: string
        - name: to_date
          in: query
          schema:
            type: string
        - name: user_id
          in: query
          schema:
            type: integer
        - name: role
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Paged audit logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogList"

  /audit-logs/{id}:
    get:
      operationId: getAuditLog
      tags: [audit-logs]
      summary: Get a single audit log entry
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Audit log entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLog"
        "404":
          description: Not found

  /audit-logs/track:
    post:
      operationId: trackAuditEvent
      tags: [audit-logs]
      summary: Record a client-side audit event (e.g. CSV exports)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackAuditEventInput"
      responses:
        "201":
          description: Recorded

components:
  schemas:
    HealthStatus:
      type: object
      required: [status, databaseStatus, timestamp]
      properties:
        status:
          type: string
        databaseStatus:
          type: string
        timestamp:
          type: string
          format: date-time

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, username, fullName, role, isActive, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        fullName:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        role:
          type: string
          enum: [admin, city_officer, kebele_officer, enumerator, viewer]
        kebeleId:
          type: ["integer", "null"]
        kebeleName:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: ["string", "null"]

    UserInput:
      type: object
      required: [username, password, fullName, role]
      properties:
        username:
          type: string
        password:
          type: string
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [admin, city_officer, kebele_officer, enumerator, viewer]
        kebeleId:
          type: ["integer", "null"]

    UserUpdate:
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [admin, city_officer, kebele_officer, enumerator, viewer]
        kebeleId:
          type: ["integer", "null"]
        isActive:
          type: boolean
        password:
          type: string

    UserStatusUpdate:
      type: object
      required: [isActive]
      properties:
        isActive:
          type: boolean
        remark:
          type: string

    RoleItem:
      type: object
      required: [value, label]
      properties:
        value:
          type: string
        label:
          type: string

    Property:
      type: object
      required: [id, propertyType, ownerName, kebele, streetName, status, createdAt]
      properties:
        id:
          type: integer
        addressCode:
          type: ["string", "null"]
